<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Chanakya AI role map</title>
  <desc id="desc">A central Chanakya AI workspace connects student, teacher, and administrator responsibilities.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a00"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18223b" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="660" rx="32" fill="#fffaf6"/>
  <text x="600" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#17213a">One platform, three role-based workspaces</text>
  <text x="600" y="98" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#667085">Your account and organization settings determine the tools you see.</text>

  <path d="M600 280 C480 250 385 230 285 235" fill="none" stroke="#f1b39a" stroke-width="4"/>
  <path d="M600 280 C720 250 815 230 915 235" fill="none" stroke="#f1b39a" stroke-width="4"/>
  <path d="M600 330 C600 420 600 440 600 485" fill="none" stroke="#f1b39a" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="430" y="170" width="340" height="190" rx="28" fill="url(#hero)"/>
    <circle cx="600" cy="220" r="28" fill="#fff" opacity=".20"/>
    <path d="M585 220h30M600 205v30" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="600" y="285" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">Chanakya AI</text>
    <text x="600" y="319" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#fff">Tests • Homework • Analytics • Administration</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="330" height="245" rx="24" fill="#fff" stroke="#e6e8ec"/>
    <circle cx="118" cy="204" r="27" fill="#e9f5ff"/>
    <text x="118" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">🎓</text>
    <text x="158" y="211" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750" fill="#17213a">Student</text>
    <text x="100" y="260" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Check today's work</text>
    <text x="100" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Complete tests and homework</text>
    <text x="100" y="336" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Review results and feedback</text>
    <text x="100" y="374" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Plan the next study step</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="150" width="330" height="245" rx="24" fill="#fff" stroke="#e6e8ec"/>
    <circle cx="848" cy="204" r="27" fill="#fff0e9"/>
    <text x="848" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">🧑‍🏫</text>
    <text x="888" y="211" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750" fill="#17213a">Teacher</text>
    <text x="830" y="260" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Create and validate work</text>
    <text x="830" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Monitor submissions</text>
    <text x="830" y="336" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Review grading and re-checks</text>
    <text x="830" y="374" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">• Act on class insights</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="455" width="490" height="150" rx="24" fill="#fff" stroke="#e6e8ec"/>
    <circle cx="415" cy="510" r="28" fill="#edf8f0"/>
    <text x="415" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">⚙️</text>
    <text x="460" y="516" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750" fill="#17213a">Administrator</text>
    <text x="390" y="560" font-family="Inter,Arial,sans-serif" font-size="17" fill="#344054">Users and sections • Subscription capacity • Activity and access</text>
  </g>
</svg>
