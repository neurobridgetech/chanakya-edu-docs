<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance window guidance</title>
  <desc id="desc">Before maintenance save and submit work, during maintenance wait and use offline plans, and after maintenance sign in and verify important work.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#c7cad1"/></marker></defs>
  <rect width="1200" height="430" rx="30" fill="#fffaf6"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#17213a">Plan around a maintenance window</text>
  <g stroke="#c7cad1" stroke-width="4" marker-end="url(#a)"><path d="M375 220H435"/><path d="M765 220H825"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="75" y="130" width="300" height="190" rx="24" fill="#fff" stroke="#e6e8ec"/>
    <circle cx="125" cy="180" r="27" fill="#eaf5ff"/><text x="125" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#2779bd">1</text>
    <text x="170" y="188" font-size="22" font-weight="750" fill="#17213a">Before</text>
    <text x="110" y="235" font-size="16" fill="#344054">• Finish or submit active work</text>
    <text x="110" y="270" font-size="16" fill="#344054">• Note the local start time</text>
    <text x="110" y="305" font-size="16" fill="#344054">• Prepare an offline plan</text>

    <rect x="435" y="130" width="330" height="190" rx="24" fill="#fff0e9" stroke="#ff8b5c" stroke-width="2"/>
    <circle cx="485" cy="180" r="27" fill="#ff4a00"/><text x="485" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text>
    <text x="530" y="188" font-size="22" font-weight="750" fill="#a83b0e">During</text>
    <text x="470" y="235" font-size="16" fill="#7c3a20">• Normal features may be unavailable</text>
    <text x="470" y="270" font-size="16" fill="#7c3a20">• Do not repeat interrupted actions</text>
    <text x="470" y="305" font-size="16" fill="#7c3a20">• Wait for the restoration notice</text>

    <rect x="825" y="130" width="300" height="190" rx="24" fill="#fff" stroke="#e6e8ec"/>
    <circle cx="875" cy="180" r="27" fill="#edf8f0"/><text x="875" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#23804a">3</text>
    <text x="920" y="188" font-size="22" font-weight="750" fill="#17213a">After</text>
    <text x="860" y="235" font-size="16" fill="#344054">• Sign in and refresh once</text>
    <text x="860" y="270" font-size="16" fill="#344054">• Verify important work</text>
    <text x="860" y="305" font-size="16" fill="#344054">• Report a specific problem</text>
  </g>
</svg>
