<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Result visibility flow</title>
  <desc id="desc">A submitted attempt is graded, reviewed by a teacher, and published before a student can see the result.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#b6bac4"/></marker></defs>
  <rect width="1200" height="420" rx="30" fill="#fffaf6"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#17213a">When does a student see a result?</text>
  <g stroke="#b6bac4" stroke-width="4" marker-end="url(#a)"><path d="M245 210H325"/><path d="M515 210H595"/><path d="M785 210H865"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g><rect x="55" y="140" width="190" height="140" rx="22" fill="#fff" stroke="#e6e8ec"/><text x="150" y="194" font-size="21" font-weight="700" fill="#17213a">Submitted</text><text x="150" y="229" font-size="15" fill="#667085">attempt recorded</text></g>
    <g><rect x="325" y="140" width="190" height="140" rx="22" fill="#fff" stroke="#e6e8ec"/><text x="420" y="194" font-size="21" font-weight="700" fill="#17213a">Graded</text><text x="420" y="229" font-size="15" fill="#667085">marks calculated</text></g>
    <g><rect x="595" y="125" width="190" height="170" rx="22" fill="#fff0e9" stroke="#ff8b5c" stroke-width="3"/><text x="690" y="187" font-size="21" font-weight="750" fill="#a83b0e">Reviewed</text><text x="690" y="222" font-size="15" fill="#7c3a20">teacher checks marks</text><text x="690" y="249" font-size="15" fill="#7c3a20">and re-checks</text></g>
    <g><rect x="865" y="140" width="280" height="140" rx="22" fill="#edf8f0" stroke="#82c99e"/><text x="1005" y="194" font-size="21" font-weight="700" fill="#195c36">Published</text><text x="1005" y="229" font-size="15" fill="#376a4b">student can open result</text></g>
  </g>
  <text x="600" y="355" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667085">A graded result can remain hidden until the teacher completes review and publishes it.</text>
</svg>
