<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Safe administrator account change</title>
  <desc id="desc">Four steps: identify the exact account, check capacity and dependencies, make the smallest change, then verify access and activity.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ff4a00"/></marker>
  </defs>
  <rect width="1200" height="430" rx="30" fill="#fffaf6"/>
  <text x="64" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#17213a">Change access without losing context</text>
  <text x="64" y="94" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667085">Use this sequence for creation, editing, password resets, membership changes, and removal.</text>
  <g fill="none" stroke="#ff4a00" stroke-width="4" marker-end="url(#arrow)">
    <path d="M296 232H328"/><path d="M582 232H614"/><path d="M868 232H900"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <g>
      <rect x="48" y="145" width="248" height="184" rx="22" fill="#fff" stroke="#e6e8ec"/>
      <circle cx="88" cy="187" r="21" fill="#ff4a00"/><text x="88" y="194" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
      <text x="122" y="194" font-size="21" font-weight="750" fill="#17213a">Identify</text>
      <text x="72" y="238" font-size="15" fill="#344054">Search the unique identifier</text>
      <text x="72" y="269" font-size="15" fill="#344054">Confirm role and organization</text>
      <text x="72" y="300" font-size="15" fill="#344054">Rule out a duplicate</text>
    </g>
    <g>
      <rect x="334" y="145" width="248" height="184" rx="22" fill="#fff" stroke="#e6e8ec"/>
      <circle cx="374" cy="187" r="21" fill="#ff4a00"/><text x="374" y="194" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
      <text x="408" y="194" font-size="21" font-weight="750" fill="#17213a">Check</text>
      <text x="358" y="238" font-size="15" fill="#344054">Review license capacity</text>
      <text x="358" y="269" font-size="15" fill="#344054">Check section membership</text>
      <text x="358" y="300" font-size="15" fill="#344054">Protect active work</text>
    </g>
    <g>
      <rect x="620" y="145" width="248" height="184" rx="22" fill="#fff" stroke="#e6e8ec"/>
      <circle cx="660" cy="187" r="21" fill="#ff4a00"/><text x="660" y="194" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
      <text x="694" y="194" font-size="21" font-weight="750" fill="#17213a">Change</text>
      <text x="644" y="238" font-size="15" fill="#344054">Edit only what is required</text>
      <text x="644" y="269" font-size="15" fill="#344054">Save once</text>
      <text x="644" y="300" font-size="15" fill="#344054">Do not expose credentials</text>
    </g>
    <g>
      <rect x="906" y="145" width="248" height="184" rx="22" fill="#17213a"/>
      <circle cx="946" cy="187" r="21" fill="#fff"/><text x="946" y="194" text-anchor="middle" font-size="20" font-weight="800" fill="#17213a">4</text>
      <text x="980" y="194" font-size="21" font-weight="750" fill="#fff">Verify</text>
      <text x="930" y="238" font-size="15" fill="#e6e8ec">Reopen the record</text>
      <text x="930" y="269" font-size="15" fill="#e6e8ec">Confirm the user's access</text>
      <text x="930" y="300" font-size="15" fill="#e6e8ec">Review the activity event</text>
    </g>
  </g>
</svg>
