<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">Assessment status and action map</title>
  <desc id="desc">Common assessment statuses and the safe next action for a teacher.</desc>
  <rect width="1400" height="570" rx="32" fill="#f8fafc"/>
  <text x="700" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="750" fill="#17213a">Status tells you what is safe to do next</text>
  <text x="700" y="96" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#667085">Actions can be unavailable until processing, submissions, or grading reaches the required stage.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(55 145)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#d8dce6"/><rect x="25" y="25" width="120" height="36" rx="18" fill="#fff4d8"/><text x="85" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#8a5b00">Processing</text><text x="25" y="106" font-size="20" font-weight="750" fill="#17213a">Wait and refresh</text><text x="25" y="146" font-size="15" fill="#667085">Extraction or generation</text><text x="25" y="171" font-size="15" fill="#667085">is still running.</text><text x="25" y="225" font-size="15" font-weight="700" fill="#17213a">Check:</text><text x="25" y="253" font-size="15" fill="#667085">status and error message</text></g>
    <g transform="translate(315 145)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#ffb99c"/><rect x="25" y="25" width="125" height="36" rx="18" fill="#fff0e9"/><text x="87" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#a83b0e">Approved</text><text x="25" y="106" font-size="20" font-weight="750" fill="#17213a">Preview first</text><text x="25" y="146" font-size="15" fill="#667085">Validate questions, answers,</text><text x="25" y="171" font-size="15" fill="#667085">marks, dates, and audience.</text><text x="25" y="225" font-size="15" font-weight="700" fill="#17213a">Then:</text><text x="25" y="253" font-size="15" fill="#667085">release or edit</text></g>
    <g transform="translate(575 145)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#9cc8ee"/><rect x="25" y="25" width="135" height="36" rx="18" fill="#eaf5ff"/><text x="92" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#246a9e">In progress</text><text x="25" y="106" font-size="20" font-weight="750" fill="#17213a">Monitor</text><text x="25" y="146" font-size="15" fill="#667085">Track submitted and missing</text><text x="25" y="171" font-size="15" fill="#667085">work without exposing results.</text><text x="25" y="225" font-size="15" font-weight="700" fill="#17213a">Open:</text><text x="25" y="253" font-size="15" fill="#667085">View students</text></g>
    <g transform="translate(835 145)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#b9b2f3"/><rect x="25" y="25" width="105" height="36" rx="18" fill="#f0efff"/><text x="77" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#594ca7">Graded</text><text x="25" y="106" font-size="20" font-weight="750" fill="#17213a">Review evidence</text><text x="25" y="146" font-size="15" fill="#667085">Inspect unusual marks and</text><text x="25" y="171" font-size="15" fill="#667085">re-check only when justified.</text><text x="25" y="225" font-size="15" font-weight="700" fill="#17213a">Then:</text><text x="25" y="253" font-size="15" fill="#667085">publish results</text></g>
    <g transform="translate(1095 145)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#a8d8bc"/><rect x="25" y="25" width="120" height="36" rx="18" fill="#edf8f0"/><text x="85" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#23804a">Published</text><text x="25" y="106" font-size="20" font-weight="750" fill="#17213a">Teach from it</text><text x="25" y="146" font-size="15" fill="#667085">Use question and learner</text><text x="25" y="171" font-size="15" fill="#667085">signals for the next lesson.</text><text x="25" y="225" font-size="15" font-weight="700" fill="#17213a">Use:</text><text x="25" y="253" font-size="15" fill="#667085">Class analysis</text></g>
  </g>
  <text x="700" y="502" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="650" fill="#a83b0e">Deleted work and deleted submissions are administrative exceptions—confirm scope before acting.</text>
</svg>
