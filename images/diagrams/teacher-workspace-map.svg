<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Teacher workspace map</title>
  <desc id="desc">The Teacher Dashboard connects to Tests, Homework, Sections, class analysis, and account tools.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#a9afbd"/></marker>
  </defs>
  <rect width="1400" height="620" rx="32" fill="#fffaf6"/>
  <text x="700" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="750" fill="#17213a">Teacher workspace</text>
  <text x="700" y="96" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#667085">Choose a section and subject once, then move from planning to evidence-based follow-up.</text>
  <g stroke="#a9afbd" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M700 255V320H235V366"/>
    <path d="M700 255V366"/>
    <path d="M700 255V320H1165V366"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="490" y="135" width="420" height="120" rx="24" fill="#17213a"/>
    <text x="700" y="183" text-anchor="middle" font-size="24" font-weight="750" fill="#fff">Dashboard</text>
    <text x="700" y="218" text-anchor="middle" font-size="16" fill="#d8dce6">Section context • daily workload • class signals</text>
    <rect x="70" y="366" width="330" height="174" rx="24" fill="#fff" stroke="#ffb99c" stroke-width="2"/>
    <text x="235" y="414" text-anchor="middle" font-size="23" font-weight="750" fill="#17213a">Tests &amp; Homework</text>
    <text x="105" y="452" font-size="16" fill="#667085">Create or upload</text><text x="105" y="480" font-size="16" fill="#667085">Preview and assign</text><text x="105" y="508" font-size="16" fill="#667085">Monitor submissions</text>
    <rect x="535" y="366" width="330" height="174" rx="24" fill="#fff" stroke="#b9b2f3" stroke-width="2"/>
    <text x="700" y="414" text-anchor="middle" font-size="23" font-weight="750" fill="#17213a">Class Analysis</text>
    <text x="570" y="452" font-size="16" fill="#667085">Overview and teacher brief</text><text x="570" y="480" font-size="16" fill="#667085">Question misconceptions</text><text x="570" y="508" font-size="16" fill="#667085">Learner follow-up groups</text>
    <rect x="1000" y="366" width="330" height="174" rx="24" fill="#fff" stroke="#a8d8bc" stroke-width="2"/>
    <text x="1165" y="414" text-anchor="middle" font-size="23" font-weight="750" fill="#17213a">Sections &amp; Account</text>
    <text x="1035" y="452" font-size="16" fill="#667085">View assigned rosters</text><text x="1035" y="480" font-size="16" fill="#667085">Update password</text><text x="1035" y="508" font-size="16" fill="#667085">Feedback and help</text>
  </g>
</svg>
