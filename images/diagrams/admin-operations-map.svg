<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Administrator operations map</title>
  <desc id="desc">The administrator checks subscription capacity before managing users and sections, verifies access, and uses activity logs for review.</desc>
  <rect width="1200" height="560" rx="30" fill="#fffaf6"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#17213a">Administrator operations map</text>
  <text x="600" y="91" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667085">Check capacity and identity before making access-changing updates.</text>
  <g fill="none" stroke="#ffb99c" stroke-width="4">
    <path d="M600 230H300V285"/><path d="M600 230H900V285"/><path d="M600 260V400"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="430" y="130" width="340" height="130" rx="24" fill="#ff4a00"/>
    <text x="600" y="185" text-anchor="middle" font-size="24" font-weight="750" fill="#fff">1. Review dashboard</text>
    <text x="600" y="218" text-anchor="middle" font-size="16" fill="#fff">subscription • limits • renewal status</text>

    <rect x="90" y="285" width="420" height="170" rx="24" fill="#fff" stroke="#e6e8ec"/>
    <text x="125" y="335" font-size="22" font-weight="750" fill="#17213a">2. Manage people</text>
    <text x="125" y="375" font-size="16" fill="#344054">Search before creating an account</text>
    <text x="125" y="407" font-size="16" fill="#344054">Verify identity before reset or removal</text>
    <text x="125" y="439" font-size="16" fill="#344054">Check licensed capacity</text>

    <rect x="690" y="285" width="420" height="170" rx="24" fill="#fff" stroke="#e6e8ec"/>
    <text x="725" y="335" font-size="22" font-weight="750" fill="#17213a">3. Maintain sections</text>
    <text x="725" y="375" font-size="16" fill="#344054">Assign the intended students and teachers</text>
    <text x="725" y="407" font-size="16" fill="#344054">Confirm class and subject context</text>
    <text x="725" y="439" font-size="16" fill="#344054">Check active work before deletion</text>

    <rect x="430" y="400" width="340" height="100" rx="22" fill="#17213a"/>
    <text x="600" y="441" text-anchor="middle" font-size="21" font-weight="750" fill="#fff">4. Verify and audit</text>
    <text x="600" y="472" text-anchor="middle" font-size="15" fill="#d0d5dd">access check • activity log • follow-up</text>
  </g>
</svg>
