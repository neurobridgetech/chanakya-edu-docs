<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From assessment result to revision plan</title>
  <desc id="desc">A loop that turns an overall result into question evidence, a pattern, one study action, and a check on the next assessment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C73500"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#F7F9FC"/>
  <text x="60" y="70" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Turn a result into a revision plan</text>
  <text x="60" y="106" font-family="Inter,Arial,sans-serif" font-size="18" fill="#596276">The score starts the review; question evidence decides what to do next.</text>

  <g font-family="Inter,Arial,sans-serif">
    <path d="M260 230H350 M550 230H640 M840 230H930" stroke="#C73500" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1030 330 C1030 510 170 510 170 330" fill="none" stroke="#C73500" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>

    <g>
      <circle cx="160" cy="230" r="100" fill="#FFF" stroke="#C73500" stroke-width="4"/>
      <text x="160" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">1. Outcome</text>
      <text x="160" y="239" text-anchor="middle" font-size="16" fill="#596276">Score, marks,</text>
      <text x="160" y="264" text-anchor="middle" font-size="16" fill="#596276">attempted count</text>
    </g>
    <g>
      <circle cx="450" cy="230" r="100" fill="#FFF" stroke="#D69500" stroke-width="4"/>
      <text x="450" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">2. Evidence</text>
      <text x="450" y="239" text-anchor="middle" font-size="16" fill="#596276">Open questions and</text>
      <text x="450" y="264" text-anchor="middle" font-size="16" fill="#596276">read feedback</text>
    </g>
    <g>
      <circle cx="740" cy="230" r="100" fill="#FFF" stroke="#5765D9" stroke-width="4"/>
      <text x="740" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">3. Pattern</text>
      <text x="740" y="239" text-anchor="middle" font-size="16" fill="#596276">Concept, process,</text>
      <text x="740" y="264" text-anchor="middle" font-size="16" fill="#596276">or upload issue?</text>
    </g>
    <g>
      <circle cx="1030" cy="230" r="100" fill="#FFF" stroke="#087A35" stroke-width="4"/>
      <text x="1030" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">4. Action</text>
      <text x="1030" y="239" text-anchor="middle" font-size="16" fill="#596276">One focused task,</text>
      <text x="1030" y="264" text-anchor="middle" font-size="16" fill="#596276">then check again</text>
    </g>

    <rect x="265" y="410" width="670" height="115" rx="22" fill="#FFF" stroke="#CBD2DE" stroke-width="2"/>
    <text x="300" y="450" font-size="18" font-weight="700" fill="#172033">Example action</text>
    <text x="300" y="483" font-size="16" fill="#596276">“Review Coulomb’s Law, solve three force-graph questions, and show the formula before substitution.”</text>
    <text x="300" y="508" font-size="14" fill="#087A35">Specific • small enough to complete • checked against the next comparable question</text>
  </g>
</svg>
