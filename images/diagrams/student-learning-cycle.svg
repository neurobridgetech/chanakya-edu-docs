<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Student learning cycle</title>
  <desc id="desc">The student checks assigned work, prepares, completes answers, submits, reviews results, and acts on feedback.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12z" fill="#ff8b5c"/>
    </marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17213a" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="30" fill="#fffaf6"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#17213a">Your learning cycle</text>
  <text x="600" y="90" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667085">Each published result should lead to one clear next action.</text>
  <g stroke="#ff8b5c" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M205 225H260"/>
    <path d="M395 225H450"/>
    <path d="M585 225H640"/>
    <path d="M775 225H830"/>
    <path d="M965 225H1020"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g filter="url(#s)"><rect x="55" y="145" width="150" height="160" rx="22" fill="#fff" stroke="#e6e8ec"/><circle cx="130" cy="190" r="25" fill="#eaf5ff"/><text x="130" y="199" font-size="23">1</text><text x="130" y="248" font-size="18" font-weight="700" fill="#17213a">Check</text><text x="130" y="274" font-size="14" fill="#667085">work and dates</text></g>
    <g filter="url(#s)"><rect x="260" y="145" width="135" height="160" rx="22" fill="#fff" stroke="#e6e8ec"/><circle cx="328" cy="190" r="25" fill="#fff0e9"/><text x="328" y="199" font-size="23">2</text><text x="328" y="248" font-size="18" font-weight="700" fill="#17213a">Prepare</text><text x="328" y="274" font-size="14" fill="#667085">read instructions</text></g>
    <g filter="url(#s)"><rect x="450" y="145" width="135" height="160" rx="22" fill="#fff" stroke="#e6e8ec"/><circle cx="518" cy="190" r="25" fill="#fff8dd"/><text x="518" y="199" font-size="23">3</text><text x="518" y="248" font-size="18" font-weight="700" fill="#17213a">Answer</text><text x="518" y="274" font-size="14" fill="#667085">review each item</text></g>
    <g filter="url(#s)"><rect x="640" y="145" width="135" height="160" rx="22" fill="#fff" stroke="#e6e8ec"/><circle cx="708" cy="190" r="25" fill="#edf8f0"/><text x="708" y="199" font-size="23">4</text><text x="708" y="248" font-size="18" font-weight="700" fill="#17213a">Submit</text><text x="708" y="274" font-size="14" fill="#667085">wait for success</text></g>
    <g filter="url(#s)"><rect x="830" y="145" width="135" height="160" rx="22" fill="#fff" stroke="#e6e8ec"/><circle cx="898" cy="190" r="25" fill="#f0efff"/><text x="898" y="199" font-size="23">5</text><text x="898" y="248" font-size="18" font-weight="700" fill="#17213a">Review</text><text x="898" y="274" font-size="14" fill="#667085">marks and feedback</text></g>
    <g filter="url(#s)"><rect x="1020" y="145" width="135" height="160" rx="22" fill="#fff" stroke="#e6e8ec"/><circle cx="1088" cy="190" r="25" fill="#ffecef"/><text x="1088" y="199" font-size="23">6</text><text x="1088" y="248" font-size="18" font-weight="700" fill="#17213a">Improve</text><text x="1088" y="274" font-size="14" fill="#667085">practice one need</text></g>
  </g>
</svg>
