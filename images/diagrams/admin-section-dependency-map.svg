<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Section dependency map</title>
  <desc id="desc">A section connects class and board context to students, teachers and subjects, which then control access to tests and homework.</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17213a" flood-opacity=".09"/></filter></defs>
  <rect width="1200" height="560" rx="30" fill="#fffaf6"/>
  <text x="600" y="57" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#17213a">A section is an access junction</text>
  <text x="600" y="90" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667085">Changing one section can affect rosters, teaching context, and active assessments.</text>
  <g fill="none" stroke="#ffb99c" stroke-width="4">
    <path d="M600 215V250H260V290"/><path d="M600 215V290"/><path d="M600 250H940V290"/>
    <path d="M260 418V470H600"/><path d="M600 418V470"/><path d="M940 418V470H600"/>
  </g>
  <g filter="url(#s)" font-family="Inter,Arial,sans-serif">
    <rect x="420" y="125" width="360" height="95" rx="23" fill="#ff4a00"/>
    <text x="600" y="168" text-anchor="middle" font-size="24" font-weight="760" fill="#fff">Section</text>
    <text x="600" y="196" text-anchor="middle" font-size="15" fill="#fff">board • class • section name</text>

    <rect x="85" y="290" width="350" height="128" rx="22" fill="#fff" stroke="#e6e8ec"/>
    <text x="260" y="338" text-anchor="middle" font-size="22" font-weight="750" fill="#17213a">Students</text>
    <text x="260" y="372" text-anchor="middle" font-size="15" fill="#344054">roster and learner access</text>

    <rect x="425" y="290" width="350" height="128" rx="22" fill="#fff" stroke="#e6e8ec"/>
    <text x="600" y="338" text-anchor="middle" font-size="22" font-weight="750" fill="#17213a">Teachers + subjects</text>
    <text x="600" y="372" text-anchor="middle" font-size="15" fill="#344054">instructional visibility and ownership</text>

    <rect x="765" y="290" width="350" height="128" rx="22" fill="#fff" stroke="#e6e8ec"/>
    <text x="940" y="338" text-anchor="middle" font-size="22" font-weight="750" fill="#17213a">Tests + homework</text>
    <text x="940" y="372" text-anchor="middle" font-size="15" fill="#344054">current and historical work</text>

    <rect x="405" y="470" width="390" height="58" rx="18" fill="#17213a"/>
    <text x="600" y="506" text-anchor="middle" font-size="18" font-weight="740" fill="#fff">Verify all three after a section change</text>
  </g>
</svg>
