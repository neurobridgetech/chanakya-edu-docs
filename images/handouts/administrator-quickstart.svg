<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Chanakya AI Administrator quick start</title>
  <desc id="desc">Six safe steps for an administrator to review organization capacity, search before creating accounts, manage people and sections, review activity, and verify access changes.</desc>
  <rect width="1200" height="1600" fill="#f8fafc"/>
  <rect width="1200" height="280" fill="#17213a"/>
  <text x="76" y="90" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#9ed6b5">CHANAKYA AI • ADMINISTRATOR</text>
  <text x="76" y="164" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="#fff">Change access safely</text>
  <text x="76" y="218" font-family="Inter,Arial,sans-serif" font-size="26" fill="#d8dce6">The smallest correct change, followed by verification</text>

  <rect x="76" y="326" width="1048" height="98" rx="22" fill="#edf8f0" stroke="#a8d8bc" stroke-width="2"/>
  <text x="110" y="385" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#23804a">Start at edu.aichanakya.in</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="76" y="476" width="1048" height="132" rx="26" fill="#fff" stroke="#d5e9dd" stroke-width="2"/>
    <circle cx="138" cy="542" r="37" fill="#23804a"/><text x="138" y="552" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">1</text>
    <text x="206" y="526" font-size="31" font-weight="800" fill="#17213a">Review the Dashboard first</text>
    <text x="206" y="570" font-size="21" fill="#667085">Confirm organization, subscription capacity, limits, and renewal context.</text>

    <rect x="76" y="640" width="1048" height="132" rx="26" fill="#fff" stroke="#d5e9dd" stroke-width="2"/>
    <circle cx="138" cy="706" r="37" fill="#23804a"/><text x="138" y="716" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">2</text>
    <text x="206" y="690" font-size="31" font-weight="800" fill="#17213a">Search before creating</text>
    <text x="206" y="734" font-size="21" fill="#667085">Use the unique ID, username, email, or roll number to prevent duplicates.</text>

    <rect x="76" y="804" width="1048" height="132" rx="26" fill="#fff" stroke="#d5e9dd" stroke-width="2"/>
    <circle cx="138" cy="870" r="37" fill="#23804a"/><text x="138" y="880" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">3</text>
    <text x="206" y="854" font-size="31" font-weight="800" fill="#17213a">Verify identity before account changes</text>
    <text x="206" y="898" font-size="21" fill="#667085">Confirm the exact person, role, organization, and dependencies before reset or removal.</text>

    <rect x="76" y="968" width="1048" height="132" rx="26" fill="#fff" stroke="#d5e9dd" stroke-width="2"/>
    <circle cx="138" cy="1034" r="37" fill="#23804a"/><text x="138" y="1044" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">4</text>
    <text x="206" y="1018" font-size="31" font-weight="800" fill="#17213a">Maintain sections carefully</text>
    <text x="206" y="1062" font-size="21" fill="#667085">Check class, board, students, teachers, subjects, and active work before editing.</text>

    <rect x="76" y="1132" width="1048" height="132" rx="26" fill="#fff" stroke="#d5e9dd" stroke-width="2"/>
    <circle cx="138" cy="1198" r="37" fill="#23804a"/><text x="138" y="1208" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">5</text>
    <text x="206" y="1182" font-size="31" font-weight="800" fill="#17213a">Review organization activity</text>
    <text x="206" y="1226" font-size="21" fill="#667085">Use activity records for follow-up; confirm identity before interpreting an event.</text>

    <rect x="76" y="1296" width="1048" height="132" rx="26" fill="#17213a"/>
    <circle cx="138" cy="1362" r="37" fill="#ff6a2a"/><text x="138" y="1372" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">6</text>
    <text x="206" y="1346" font-size="31" font-weight="800" fill="#fff">Verify after every change</text>
    <text x="206" y="1390" font-size="21" fill="#d8dce6">Reopen the record and confirm access, membership, status, and expected activity.</text>
  </g>

  <rect x="76" y="1470" width="1048" height="64" rx="20" fill="#fff1f0" stroke="#fda29b" stroke-width="2"/>
  <text x="600" y="1511" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#b42318">Permanent deletion is irreversible—confirm policy and dependencies first.</text>
  <text x="600" y="1572" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#667085">Detailed guide: docs.aichanakya.in/admin-guide/overview</text>
</svg>
