<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Chanakya AI Teacher quick start</title>
  <desc id="desc">Six steps for a teacher to choose a class context, create or upload work, validate, monitor, review and publish, then act on class analysis.</desc>
  <rect width="1200" height="1600" fill="#fffaf6"/>
  <rect width="1200" height="280" fill="#17213a"/>
  <text x="76" y="90" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#ff8b5c">CHANAKYA AI • TEACHER</text>
  <text x="76" y="164" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="#fff">Plan, review, improve</text>
  <text x="76" y="218" font-family="Inter,Arial,sans-serif" font-size="26" fill="#d8dce6">A safe assessment workflow from Dashboard to the next lesson</text>

  <rect x="76" y="326" width="1048" height="98" rx="22" fill="#fff0e9" stroke="#ffb99c" stroke-width="2"/>
  <text x="110" y="385" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#a83b0e">Start at edu.aichanakya.in</text>

  <line x1="118" y1="500" x2="118" y2="1330" stroke="#ffb99c" stroke-width="6"/>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="118" cy="530" r="38" fill="#ff4a00"/><text x="118" y="540" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">1</text>
    <text x="188" y="521" font-size="32" font-weight="800" fill="#17213a">Choose section and subject</text>
    <text x="188" y="562" font-size="21" fill="#667085">Confirm the Dashboard context before reading metrics or creating work.</text>

    <circle cx="118" cy="675" r="38" fill="#ff4a00"/><text x="118" y="685" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">2</text>
    <text x="188" y="666" font-size="32" font-weight="800" fill="#17213a">Create or upload</text>
    <text x="188" y="707" font-size="21" fill="#667085">Use New Test for generated or uploaded papers; use New Homework</text>
    <text x="188" y="740" font-size="21" fill="#667085">for a PDF assignment with a duration.</text>

    <circle cx="118" cy="838" r="38" fill="#ff4a00"/><text x="118" y="848" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">3</text>
    <text x="188" y="829" font-size="32" font-weight="800" fill="#17213a">Preview before release</text>
    <text x="188" y="870" font-size="21" fill="#667085">Check audience, dates, questions, diagrams, marks, instructions,</text>
    <text x="188" y="903" font-size="21" fill="#667085">and the answer key. AI-generated content needs teacher review.</text>

    <circle cx="118" cy="1001" r="38" fill="#ff4a00"/><text x="118" y="1011" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">4</text>
    <text x="188" y="992" font-size="32" font-weight="800" fill="#17213a">Monitor submissions</text>
    <text x="188" y="1033" font-size="21" fill="#667085">Open View students to distinguish missing work from weak answers.</text>
    <text x="188" y="1066" font-size="21" fill="#667085">Use learner-level data only for the intended educational purpose.</text>

    <circle cx="118" cy="1164" r="38" fill="#ff4a00"/><text x="118" y="1174" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">5</text>
    <text x="188" y="1155" font-size="32" font-weight="800" fill="#17213a">Review, then publish</text>
    <text x="188" y="1196" font-size="21" fill="#667085">Inspect surprising marks and re-check only when answer evidence</text>
    <text x="188" y="1229" font-size="21" fill="#667085">supports it. Publish only when learners should see results.</text>

    <circle cx="118" cy="1327" r="38" fill="#ff4a00"/><text x="118" y="1337" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">6</text>
    <text x="188" y="1318" font-size="32" font-weight="800" fill="#17213a">Use Class analysis</text>
    <text x="188" y="1359" font-size="21" fill="#667085">Verify question evidence, group follow-up needs, and plan the next</text>
    <text x="188" y="1392" font-size="21" fill="#667085">reteach, extension, or targeted-practice step.</text>
  </g>

  <rect x="76" y="1450" width="1048" height="82" rx="22" fill="#17213a"/>
  <text x="600" y="1502" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Validate → monitor → review → publish → act</text>
  <text x="600" y="1570" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#667085">Detailed guide: docs.aichanakya.in/teacher-guide/overview</text>
</svg>
